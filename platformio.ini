; PlatformIO Project Configuration File
; ESP32-S3 N16R8 GPS Lap Timer
; Board: ESP32-S3 DevKitC-1 (16MB flash, 8MB PSRAM OPI)

[env:esp32-s3-devkitc-1]
platform               = espressif32
board                  = esp32-s3-devkitc-1-n16r8
framework              = arduino

; Serial monitor
monitor_speed          = 115200
monitor_filters        = esp32_exception_decoder

; Flash & memory
board_upload.flash_size        = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions         = huge_app.csv

; Upload
upload_speed           = 460800

; Libraries
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    greiman/SdFat   @ ^2.2.3

; Build flags
; --- TFT_eSPI is configured here via preprocessor defines ---
; --- PSRAM: explicitly enable for ps_malloc() in lap_timer/delta ---
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_RGB_ORDER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_BL=47
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_FSPI_PORT=1
    -DSPI_FREQUENCY=10000000
    -DSPI_READ_FREQUENCY=6000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DBOARD_HAS_PSRAM=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1  ; disabled: Serial goes through COM port for debugging
    -I src
