; PlatformIO Project Configuration File
; ESP32-S3 N16R8 GPS Lap Timer
; Board: ESP32-S3 DevKitC-1 (16MB flash, 8MB PSRAM OPI)

[env:esp32-s3-devkitc-1]
platform               = espressif32
board                  = esp32-s3-devkitc-1
framework              = arduino

; Serial monitor
monitor_speed          = 115200
monitor_filters        = esp32_exception_decoder

; Flash & memory
board_upload.flash_size        = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions         = huge_app.csv

; Upload
upload_speed           = 921600

; Libraries
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    greiman/SdFat   @ ^2.2.3

; Build flags
; --- TFT_eSPI: all config lives in src/User_Setup.h (single source of truth) ---
; --- Only -I src is needed so the compiler finds our User_Setup.h first ---
build_flags =
    -I src
